name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check . && python -m ruff format --check .

      - name: Test
        run: python -m pytest --cov=cloudledger --cov-report=term-missing

      - name: Smoke-test the CLI against the example export
        run: |
          cloudledger report examples/usage-2026-09.csv --budget platform=4000 --json
          cloudledger forecast examples/usage-2026-09.csv --as-of 2026-09-21 --json
