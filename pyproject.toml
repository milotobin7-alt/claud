[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudledger"
version = "0.1.0"
description = "Track cloud spend against budgets and project month-end totals."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["finops", "cloud", "cost", "budget", "forecasting"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
# Upper bounds on purpose: an unpinned formatter turns an unrelated day's
# release into red CI. ruff 0.16 began formatting code blocks inside
# Markdown, which broke this build on a README that had not changed.
dev = ["pytest>=8.0,<10", "pytest-cov>=5.0,<8", "ruff>=0.16.9,<0.17"]

[project.scripts]
cloudledger = "cloudledger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
